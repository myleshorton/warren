[package]
name = "warren"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dht-next = { path = "../dht-next" }
crypto = { path = "../crypto" }
swarm = { path = "../swarm" }
driver = { path = "../driver" }
transfer = { path = "../transfer" }
feed = { path = "../feed" }
feed-redb = { path = "../feed-redb" }
blob = { path = "../blob" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The application supplies a Tokio runtime; the network adapter schedules renewals
# and cancellation cleanup on that runtime.
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
